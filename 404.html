<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not found — Teanaway Sock Co.</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0B0B0B">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:#FFFFFF;color:#26282A;min-height:100svh;
  font-family:'Inter',-apple-system,Helvetica Neue,Arial,sans-serif;font-size:15px;line-height:1.55;
  display:flex;align-items:center;justify-content:center;padding:clamp(24px,6vw,64px);
  -webkit-font-smoothing:antialiased;
}
main{max-width:46ch}
.mark{
  font-family:'Inter Tight',sans-serif;font-weight:600;font-size:18px;letter-spacing:.24em;
  text-transform:uppercase;color:#0B0B0B;text-decoration:none;display:inline-block;
}
.rule{width:34px;height:2px;background:#9E4A28;margin:22px 0}
h1{font-family:'Inter Tight',sans-serif;font-weight:500;letter-spacing:-.02em;line-height:1.06;
  font-size:clamp(28px,5vw,46px);color:#0B0B0B}
p{color:#6B6E70;margin-top:14px}
a.btn{
  display:inline-flex;align-items:center;justify-content:center;margin-top:26px;height:46px;padding:0 26px;
  background:#0B0B0B;color:#fff;border-radius:2px;text-decoration:none;
  font-family:'Inter Tight',sans-serif;font-weight:500;font-size:14px;
}
a.btn:hover{background:#333537}
a:focus-visible,.mark:focus-visible{outline:2px solid #0B0B0B;outline-offset:3px}
</style>
</head>
<body>
<main>
  <a class="mark" href="/">Teanaway</a>
  <div class="rule"></div>
  <h1>This one went off-trail</h1>
  <p>That page is not here. The socks are.</p>
  <a class="btn" href="/">Back to the line</a>
</main>
</body>
</html>
